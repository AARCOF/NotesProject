<div class="content-wrapper d-flex align-items-center auth px-0 min-vh-100 bg-light">
  <div class="row w-100 mx-0 justify-content-center">
    <div class="col-lg-4 col-md-6 mx-auto">
      
      <div class="auth-form-light text-left py-5 px-4 px-sm-5 rounded shadow">
        
        <div class="brand-logo text-center mb-3">
          <div class="icon-circle bg-primary text-white mx-auto mb-2" style="width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="typcn typcn-key font-size-26"></i>
          </div>
          <h3 class="font-weight-bold text-dark mb-1">Iniciar Sesión</h3>
          <p class="text-muted font-size-14">Seguridad JWT + reCAPTCHA + Capa de Autenticación</p>
        </div>

        <!-- Banner de Credenciales Demostrativas -->
        <div class="alert alert-info border small mb-3 p-2">
          <strong>💡 Usuario Demostrativo:</strong><br>
          <strong>Correo:</strong> <code>usuario@ejemplo.com</code><br>
          <strong>Contraseña:</strong> <code>password123</code>
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
          <i class="typcn typcn-warning mr-1"></i> {{ errorMessage }}
        </div>

        <div class="alert alert-success" *ngIf="successMessage">
          <i class="typcn typcn-tick mr-1"></i> {{ successMessage }}
        </div>

        <form (ngSubmit)="onLogin()">
          
          <div class="form-group mb-3">
            <label class="font-weight-bold text-dark">Correo Electrónico</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="typcn typcn-mail"></i></span>
              </div>
              <input 
                type="email" 
                class="form-control" 
                placeholder="correo@ejemplo.com" 
                [(ngModel)]="email" 
                name="email" 
                required>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="font-weight-bold text-dark">Contraseña</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="typcn typcn-lock-closed"></i></span>
              </div>
              <input 
                type="password" 
                class="form-control" 
                placeholder="********" 
                [(ngModel)]="password" 
                name="password" 
                required>
            </div>
          </div>

          <!-- Componente reCAPTCHA -->
          <div class="form-group mb-3">
            <app-recaptcha></app-recaptcha>
          </div>

          <div class="mt-3">
            <button 
              type="submit" 
              class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn shadow-sm" 
              [disabled]="isLoading || !email || !password">
              <span class="spinner-border spinner-border-sm mr-1" *ngIf="isLoading"></span>
              Ingresar con JWT
            </button>
          </div>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted font-size-14 mr-1">¿No tienes una cuenta aún?</span>
            <a routerLink="/register" class="text-primary font-weight-bold">Regístrate aquí</a>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
