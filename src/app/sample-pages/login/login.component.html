<div class="content-wrapper d-flex align-items-center auth px-0 min-vh-100 bg-gradient-light">
  <div class="row w-100 mx-0 justify-content-center">
    <div class="col-lg-4 col-md-6 mx-auto">
      
      <div class="auth-form-light text-left py-5 px-4 px-sm-5 rounded-xl shadow-lg border-0 bg-white">
        
        <div class="brand-logo text-center mb-4">
          <div class="icon-avatar-lg bg-gradient-primary text-white mx-auto mb-3 shadow-md">
            <i class="typcn typcn-key font-size-30"></i>
          </div>
          <h3 class="font-weight-bold text-slate-800 mb-1">Iniciar Sesión</h3>
          <p class="text-slate-500 font-size-14 mb-0">Sistema de Seguridad StarNotes</p>
        </div>

        <div class="alert alert-indigo border-0 small mb-4 p-3 rounded-lg">
          <div class="font-weight-bold text-indigo-dark mb-1">Usuario Demostrativo:</div>
          <div class="text-slate-700">Correo: <strong class="text-slate-900">usuario@ejemplo.com</strong></div>
          <div class="text-slate-700">Contraseña: <strong class="text-slate-900">password123</strong></div>
        </div>

        <div class="alert alert-danger-custom mb-3" *ngIf="errorMessage">
          <i class="typcn typcn-warning mr-1"></i> {{ errorMessage }}
        </div>

        <div class="alert alert-success-custom mb-3" *ngIf="successMessage">
          <i class="typcn typcn-tick mr-1"></i> {{ successMessage }}
        </div>

        <form (ngSubmit)="onLogin()">
          
          <div class="form-group mb-3">
            <label class="font-weight-bold text-slate-700 font-size-14">Correo Electrónico</label>
            <div class="input-group input-group-indigo">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="typcn typcn-mail"></i></span>
              </div>
              <input 
                type="email" 
                class="form-control" 
                placeholder="correo@ejemplo.com" 
                [(ngModel)]="email" 
                name="email" 
                required>
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="font-weight-bold text-slate-700 font-size-14">Contraseña</label>
            <div class="input-group input-group-indigo">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="typcn typcn-lock-closed"></i></span>
              </div>
              <input 
                type="password" 
                class="form-control" 
                placeholder="********" 
                [(ngModel)]="password" 
                name="password" 
                required>
            </div>
          </div>

          <div class="form-group mb-4">
            <app-recaptcha></app-recaptcha>
          </div>

          <div class="mt-4">
            <button 
              type="submit" 
              class="btn btn-block btn-gradient-primary btn-lg font-weight-bold shadow-md py-3 text-white" 
              [disabled]="isLoading || !email || !password">
              <span class="spinner-border spinner-border-sm mr-2" *ngIf="isLoading"></span>
              Ingresar al Sistema
            </button>
          </div>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-slate-500 font-size-14 mr-1">¿No tienes una cuenta aún?</span>
            <a routerLink="/register" class="text-indigo font-weight-bold text-decoration-none">Regístrate aquí</a>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
