<div class="content-wrapper d-flex align-items-center auth px-0 min-vh-100 bg-light">
  <div class="row w-100 mx-0 justify-content-center">
    <div class="col-lg-5 col-md-7 mx-auto">
      
      <div class="auth-form-light text-left py-5 px-4 px-sm-5 rounded shadow">
        
        <div class="brand-logo text-center mb-3">
          <div class="icon-circle bg-primary text-white mx-auto mb-2" style="width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="typcn typcn-user-add font-size-26"></i>
          </div>
          <h3 class="font-weight-bold text-dark mb-1">Registro de Cuenta</h3>
          <p class="text-muted font-size-14">Validación con Correo + Llave de Seguridad (1 Hora)</p>
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
          <i class="typcn typcn-warning mr-1"></i> {{ errorMessage }}
        </div>

        <div class="alert alert-success" *ngIf="successMessage">
          <i class="typcn typcn-tick mr-1"></i> {{ successMessage }}
        </div>

        <form (ngSubmit)="onRegister()">
          
          <div class="form-group mb-3">
            <label class="font-weight-bold text-dark">Nombre Completo <span class="text-danger">*</span></label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="Ej: Carlos Pérez" 
              [(ngModel)]="name" 
              name="name" 
              required>
          </div>

          <div class="form-group mb-3">
            <label class="font-weight-bold text-dark">Correo Electrónico <span class="text-danger">*</span></label>
            <input 
              type="email" 
              class="form-control" 
              placeholder="carlos@ejemplo.com" 
              [(ngModel)]="email" 
              name="email" 
              required>
          </div>

          <div class="row">
            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-dark">Contraseña <span class="text-danger">*</span></label>
              <input 
                type="password" 
                class="form-control" 
                placeholder="********" 
                [(ngModel)]="password" 
                name="password" 
                required>
            </div>

            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-dark">Confirmar <span class="text-danger">*</span></label>
              <input 
                type="password" 
                class="form-control" 
                placeholder="********" 
                [(ngModel)]="confirmPassword" 
                name="confirmPassword" 
                required>
            </div>
          </div>

          <!-- Componente reCAPTCHA -->
          <div class="form-group mb-3">
            <app-recaptcha></app-recaptcha>
          </div>

          <div class="mt-3">
            <button 
              type="submit" 
              class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn shadow-sm" 
              [disabled]="isLoading || !name || !email || !password || password !== confirmPassword">
              <span class="spinner-border spinner-border-sm mr-1" *ngIf="isLoading"></span>
              Registrar y Enviar Llave (1 Hora)
            </button>
          </div>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted font-size-14 mr-1">¿Ya tienes una cuenta?</span>
            <a routerLink="/login" class="text-primary font-weight-bold">Inicia Sesión</a>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
