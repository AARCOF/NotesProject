<div class="content-wrapper d-flex align-items-center auth px-0 min-vh-100 bg-gradient-light">
  <div class="row w-100 mx-0 justify-content-center">
    <div class="col-lg-5 col-md-7 mx-auto">
      
      <div class="auth-form-light text-left py-5 px-4 px-sm-5 rounded-xl shadow-lg border-0 bg-white">
        
        <div class="brand-logo text-center mb-4">
          <div class="icon-avatar-lg bg-gradient-primary text-white mx-auto mb-3 shadow-md">
            <i class="typcn typcn-user-add font-size-30"></i>
          </div>
          <h3 class="font-weight-bold text-slate-800 mb-1">Registro de Cuenta</h3>
          <p class="text-slate-500 font-size-14 mb-0">Validación de Correo y Código de Seguridad</p>
        </div>

        <div class="alert alert-danger-custom mb-3" *ngIf="errorMessage">
          <i class="typcn typcn-warning mr-1"></i> {{ errorMessage }}
        </div>

        <div class="alert alert-success-custom mb-3" *ngIf="successMessage">
          <i class="typcn typcn-tick mr-1"></i> {{ successMessage }}
        </div>

        <form (ngSubmit)="onRegister()">
          
          <div class="form-group mb-3">
            <label class="font-weight-bold text-slate-700 font-size-14">Nombre Completo <span class="text-danger">*</span></label>
            <input 
              type="text" 
              class="form-control input-indigo" 
              placeholder="Carlos Pérez" 
              [(ngModel)]="name" 
              name="name" 
              required>
          </div>

          <div class="form-group mb-3">
            <label class="font-weight-bold text-slate-700 font-size-14">Correo Electrónico <span class="text-danger">*</span></label>
            <input 
              type="email" 
              class="form-control input-indigo" 
              placeholder="carlos@ejemplo.com" 
              [(ngModel)]="email" 
              name="email" 
              required>
          </div>

          <div class="row">
            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-slate-700 font-size-14">Contraseña <span class="text-danger">*</span></label>
              <input 
                type="password" 
                class="form-control input-indigo" 
                placeholder="********" 
                [(ngModel)]="password" 
                name="password" 
                required>
            </div>

            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-slate-700 font-size-14">Confirmar <span class="text-danger">*</span></label>
              <input 
                type="password" 
                class="form-control input-indigo" 
                placeholder="********" 
                [(ngModel)]="confirmPassword" 
                name="confirmPassword" 
                required>
            </div>
          </div>

          <div class="form-group mb-4">
            <app-recaptcha></app-recaptcha>
          </div>

          <div class="mt-4">
            <button 
              type="submit" 
              class="btn btn-block btn-gradient-primary btn-lg font-weight-bold shadow-md py-3 text-white" 
              [disabled]="isLoading || !name || !email || !password || password !== confirmPassword">
              <span class="spinner-border spinner-border-sm mr-2" *ngIf="isLoading"></span>
              Registrar y Enviar Código
            </button>
          </div>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-slate-500 font-size-14 mr-1">¿Ya tienes una cuenta?</span>
            <a routerLink="/login" class="text-indigo font-weight-bold text-decoration-none">Inicia Sesión</a>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
