<div class="auth-page-container">
  
  <!-- Ambient background glow spheres -->
  <div class="auth-glow-circle glow-cyan"></div>
  <div class="auth-glow-circle glow-orange"></div>

  <!-- Botón Volver a Inicio -->
  <a routerLink="/" class="btn btn-back-home shadow-sm" title="Volver a la página principal">
    <i class="typcn typcn-arrow-left mr-1"></i> Inicio
  </a>

  <!-- Tarjeta Centralizada -->
  <div class="auth-card-modern text-left">
    
    <div class="brand-logo text-center mb-4">
      <div class="icon-avatar-lg bg-slate-900 text-white mx-auto mb-3 shadow-md d-flex align-items-center justify-content-center" style="border-radius: 18px; border: 1px solid rgba(255,255,255,0.1);">
        <img src="assets/images/noteyou-logo-white.png" alt="NoteYou Logo" style="width: 38px; height: 38px; object-fit: contain;">
      </div>
      <h3 class="font-weight-bold text-slate-900 mb-1">
        Crear <span class="text-orange">Cuenta</span>
      </h3>
      <p class="text-slate-500 font-size-13 mb-0">Únete a NoteYou y organiza tu día con fluidez</p>
    </div>

    <div class="alert alert-danger-custom mb-3" *ngIf="errorMessage">
      <i class="typcn typcn-warning mr-1"></i> {{ errorMessage }}
    </div>

    <div class="alert alert-success-custom mb-3" *ngIf="successMessage">
      <i class="typcn typcn-tick mr-1"></i> {{ successMessage }}
    </div>

    <form (ngSubmit)="onRegister()" autocomplete="off">
      
      <div class="form-group mb-3">
        <label class="font-weight-semibold text-slate-700 font-size-13 mb-1">Nombre Completo <span class="text-danger">*</span></label>
        <div class="input-group input-group-custom-auth">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="typcn typcn-user"></i></span>
          </div>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Tu nombre completo" 
            [(ngModel)]="name" 
            name="name" 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            required>
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="font-weight-semibold text-slate-700 font-size-13 mb-1">Correo Electrónico <span class="text-danger">*</span></label>
        <div class="input-group input-group-custom-auth">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="typcn typcn-mail"></i></span>
          </div>
          <input 
            type="email" 
            class="form-control" 
            placeholder="correo@ejemplo.com" 
            [(ngModel)]="email" 
            name="email" 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            required>
        </div>
      </div>

      <div class="form-row">
        <div class="col-md-6 form-group mb-3">
          <label class="font-weight-semibold text-slate-700 font-size-13 mb-1">Contraseña <span class="text-danger">*</span></label>
          <div class="input-group input-group-custom-auth">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="typcn typcn-lock-closed"></i></span>
            </div>
            <input 
              type="password" 
              class="form-control" 
              placeholder="Contraseña" 
              [(ngModel)]="password" 
              name="password" 
              autocomplete="new-password"
              required>
          </div>
        </div>

        <div class="col-md-6 form-group mb-3">
          <label class="font-weight-semibold text-slate-700 font-size-13 mb-1">Confirmar <span class="text-danger">*</span></label>
          <div class="input-group input-group-custom-auth">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="typcn typcn-lock-closed"></i></span>
            </div>
            <input 
              type="password" 
              class="form-control" 
              placeholder="Repetir" 
              [(ngModel)]="confirmPassword" 
              name="confirmPassword" 
              autocomplete="new-password"
              required>
          </div>
        </div>
      </div>

      <div class="form-group mb-4">
        <app-recaptcha></app-recaptcha>
      </div>

      <div class="mt-4">
        <button 
          type="submit" 
          class="btn btn-block btn-orange-auth btn-lg font-weight-bold shadow-md py-3 text-white" 
          [disabled]="isLoading || !name || !email || !password || password !== confirmPassword">
          <span class="spinner-border spinner-border-sm mr-2" *ngIf="isLoading"></span>
          Registrar y Enviar Código
        </button>
      </div>

      <div class="text-center mt-4 pt-3 border-top border-slate-100">
        <span class="text-slate-500 font-size-13 mr-1">¿Ya tienes una cuenta?</span>
        <a routerLink="/login" class="text-blue font-weight-bold text-decoration-none hover-underline font-size-13">Inicia Sesión</a>
      </div>

    </form>

  </div>

</div>
