<header class="mobile-app-header">
  <div class="header-top-row">
    
    <!-- Usuario & Saludo -->
    <div class="user-greeting-wrapper" routerLink="/profile">
      <div class="user-avatar-pill">
        <span class="avatar-initial">{{ userInitial }}</span>
        <span class="online-dot"></span>
      </div>
      <div class="greeting-text">
        <span class="sub-greeting">Hola,</span>
        <h4 class="user-name">{{ userFirstName }} 👋</h4>
      </div>
    </div>

    <!-- Acciones Rápidas -->
    <div class="header-actions">
      <!-- Botón de Notas Rápidas (Post-its) -->
      <button class="header-icon-btn btn-quick-notes-trigger" (click)="onQuickNotesClick()" title="Notas Rápidas" aria-label="Notas Rápidas">
        <i class="typcn typcn-flash"></i>
      </button>

      <!-- Botón de Nueva Tarea / Nueva Categoría / Nuevo Gasto dinámico según la sección (oculto en pestaña de gráficos) -->
      <button class="header-btn-new-task shadow-sm" *ngIf="notesViewMode !== 'graficos' && expensesActiveTab !== 'graficas'" (click)="onCreateActionClick()" [title]="createButtonLabel" [attr.aria-label]="createButtonLabel">
        <i class="typcn typcn-plus font-size-16 mr-1"></i>
        <span>{{ createButtonLabel }}</span>
      </button>

      <!-- Botón de Notificaciones / Recordatorios -->
      <button class="header-icon-btn" routerLink="/calendar" title="Agenda & Alertas" aria-label="Agenda">
        <i class="typcn typcn-bell"></i>
      </button>

      <!-- Botón de Cerrar Sesión -->
      <button class="header-icon-btn btn-logout-mobile text-danger" (click)="onLogout()" title="Cerrar Sesión" aria-label="Cerrar Sesión">
        <i class="typcn typcn-power"></i>
      </button>
    </div>

  </div>

  <!-- PESTAÑAS SECUNDARIAS INTEGRADAS DIRECTAMENTE EN EL ENCABEZADO (0px GAP) -->
  <!-- En Notas / Dashboard -->
  <div class="header-subtabs-row mt-1-5 pt-0-5" *ngIf="isNotesRoute">
    <div class="mobile-notes-segmented-bar bg-slate-100 rounded-xl p-0-5 d-flex align-items-center justify-content-between border border-slate-200">
      <button type="button" class="btn-mobile-subtab" [class.active]="notesViewMode === 'kanban'" (click)="setNotesViewMode('kanban')">
        <i class="typcn typcn-th-small"></i>
        <span>Kanban</span>
      </button>
      <button type="button" class="btn-mobile-subtab" [class.active]="notesViewMode === 'grid'" (click)="setNotesViewMode('grid')">
        <i class="typcn typcn-th-large"></i>
        <span>Cuadrícula</span>
      </button>
      <button type="button" class="btn-mobile-subtab" [class.active]="notesViewMode === 'categorias'" (click)="setNotesViewMode('categorias')">
        <i class="typcn typcn-folder-open"></i>
        <span>Categorías</span>
      </button>
      <button type="button" class="btn-mobile-subtab" [class.active]="notesViewMode === 'graficos'" (click)="setNotesViewMode('graficos')">
        <i class="typcn typcn-chart-pie"></i>
        <span>Gráficos</span>
      </button>
    </div>
  </div>

  <!-- En Gastos -->
  <div class="header-subtabs-row mt-1-5 pt-0-5" *ngIf="isExpensesRoute">
    <div class="mobile-expenses-segmented-bar bg-slate-100 rounded-xl p-0-5 d-flex align-items-center justify-content-between border border-slate-200">
      <button type="button" class="btn-mobile-subtab" [class.active]="expensesActiveTab === 'gestion'" (click)="setExpensesTab('gestion')">
        <i class="typcn typcn-credit-card"></i>
        <span>Gestión</span>
      </button>
      <button type="button" class="btn-mobile-subtab" [class.active]="expensesActiveTab === 'movimientos'" (click)="setExpensesTab('movimientos')">
        <i class="typcn typcn-th-list"></i>
        <span>Gastos</span>
      </button>
      <button type="button" class="btn-mobile-subtab" [class.active]="expensesActiveTab === 'categorias'" (click)="setExpensesTab('categorias')">
        <i class="typcn typcn-folder-open"></i>
        <span>Categorías</span>
      </button>
      <button type="button" class="btn-mobile-subtab" [class.active]="expensesActiveTab === 'graficas'" (click)="setExpensesTab('graficas')">
        <i class="typcn typcn-chart-pie"></i>
        <span>Gráficos</span>
      </button>
    </div>
  </div>

  <!-- Carrusel de Filtros de Categorías (Pill Chips) -->
  <div class="categories-scroll-row" *ngIf="showCategories && categories.length > 0">
    <div class="category-chips-track">
      <button 
        *ngFor="let cat of categories"
        class="category-pill-chip" 
        [class.active]="selectedCategory === cat"
        (click)="onSelectCategory(cat)">
        {{ cat }}
      </button>
    </div>
  </div>
</header>
