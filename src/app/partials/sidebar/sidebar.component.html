<nav class="sidebar sidebar-offcanvas bg-slate-900 shadow-lg" id="sidebar">
  <ul class="nav">
    
    <li class="nav-item nav-profile px-3 py-3 border-bottom-slate" *ngIf="currentUser">

            {{ currentUser.name.charAt(0).toUpperCase() }}
          </div>
        </div>
        <div class="text-wrapper">
          <p class="profile-name mb-0 font-weight-bold text-white font-size-14">{{ currentUser.name }}</p>
          <p class="designation mb-0 text-indigo-300 font-size-12">Usuario Verificado</p>
        </div>
      </div>
    </li>

    <li class="nav-category-header font-weight-bold text-slate-400 px-4 py-3 text-uppercase font-size-11 letter-spacing-1">
      Navegación Principal
    </li>

    <li class="nav-item">
      <a class="nav-link py-3 px-4" routerLink="/dashboard" routerLinkActive="active">
        <i class="menu-icon typcn typcn-document-text text-indigo-400 font-size-20 mr-3"></i>
        <span class="menu-title font-weight-semibold font-size-15">Mis Notas</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link py-3 px-4" routerLink="/categories" routerLinkActive="active">
        <i class="menu-icon typcn typcn-folder-open text-amber-400 font-size-20 mr-3"></i>
        <span class="menu-title font-weight-semibold font-size-15">Categorías</span>
      </a>
    </li>

    <li class="nav-category-header font-weight-bold text-slate-400 px-4 py-3 mt-3 text-uppercase font-size-11 letter-spacing-1">
      Seguridad y Cuenta
    </li>

    <li class="nav-item" *ngIf="currentUser">
      <a class="nav-link py-3 px-4" routerLink="/verify-email" routerLinkActive="active">
        <i class="menu-icon typcn typcn-lock-closed text-indigo-400 font-size-20 mr-3"></i>
        <span class="menu-title font-size-15">Verificación de Llave</span>
      </a>
    </li>

    <li class="nav-item" *ngIf="currentUser">
      <a class="nav-link py-3 px-4 cursor-pointer text-rose-400" (click)="logout()">
        <i class="menu-icon typcn typcn-power-outline text-rose-400 font-size-20 mr-3"></i>
        <span class="menu-title font-weight-bold font-size-15">Cerrar Sesión</span>
