<div class="app-root-container" [class.is-standalone]="!showNav" [class.is-mobile-app]="isMobileView">
  
  <!-- Barra de navegación fija de Escritorio (Solo en Desktop autenticado) -->
  <app-navbar *ngIf="showNav && !isMobileView"></app-navbar>

  <!-- Barra Superior Nativa Móvil (Solo en Celular/APK autenticado) -->
  <app-mobile-header 
    *ngIf="showNav && isMobileView"
    (openQuickNotes)="toggleMobileQuickNotes()">
  </app-mobile-header>

  <div class="container-fluid page-body-wrapper" [class.full-page-wrapper]="!showNav" [class.mobile-body-wrapper]="isMobileView">
    
    <!-- Barra lateral de Escritorio (Solo en Desktop autenticado) -->
    <app-sidebar *ngIf="showNav && !isMobileView"></app-sidebar>

    <!-- Panel principal -->
    <div class="main-panel border-0" [class.w-100]="!showNav || isMobileView">
      <div class="content-wrapper border-0 p-0" [class.mobile-content-pad]="isMobileView && showNav">
        
        <div class="workspace-wrapper" [class.public-mode]="!showNav" [class.mobile-workspace]="isMobileView">
          
          <!-- Columna de Notas Rápidas de Escritorio (Oculta en Celular y en vista de Gastos) -->
          <aside class="quick-notes-column" *ngIf="showQuickNotes && !isMobileView">
            <app-quick-notes-panel [availableTasks]="globalTasks"></app-quick-notes-panel>
          </aside>

          <!-- ÚNICO Router Outlet unificado -->
          <main class="workspace-view-container" [class.authenticated-view]="showNav" [class.public-view]="!showNav" [class.mobile-view-container]="isMobileView">
            <router-outlet></router-outlet>
          </main>

        </div>

      </div>
    </div>

  </div>

  <!-- Barra de Navegación Inferior Nativa Móvil (Bottom Navigation Bar) -->
  <app-mobile-bottom-nav 
    *ngIf="showNav && isMobileView" 
    (openCreate)="onFabCreate()">
  </app-mobile-bottom-nav>

  <!-- Burbuja Flotante de Notas Rápidas (Estilo Chat Flotante en Móvil / APK - Lado Inferior Derecho) -->
  <button 
    type="button" 
    class="mobile-quick-notes-fab-bubble" 
    *ngIf="showNav && isMobileView" 
    (click)="toggleMobileQuickNotes()"
    [class.active]="isMobileQuickNotesOpen"
    title="Notas Rápidas"
    aria-label="Abrir Notas Rápidas">
    <div class="fab-bubble-icon">
      <i class="typcn typcn-flash"></i>
    </div>
    <span class="fab-badge-count shadow-sm" *ngIf="quickNotesCount > 0">{{ quickNotesCount }}</span>
  </button>

  <!-- Ventana de Chat de Notas Rápidas en Móvil / APK -->
  <div class="mobile-quick-notes-backdrop" *ngIf="isMobileQuickNotesOpen" (click)="toggleMobileQuickNotes()">
    <div class="mobile-quick-notes-chat-window shadow-2xl" (click)="$event.stopPropagation()">
      
      <!-- Encabezado Estilo Chat -->
      <div class="chat-window-header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <div class="chat-avatar-pill text-white rounded-circle d-flex align-items-center justify-content-center">
            <i class="typcn typcn-flash font-size-18"></i>
          </div>
          <div>
            <h6 class="font-weight-bold text-slate-800 mb-0 font-size-14 line-height-tight">Notas Rápidas</h6>
            <div class="d-flex align-items-center mt-0-5">
              <span class="chat-status-dot mr-1"></span>
              <small class="text-slate-400 font-size-10 font-weight-medium">Chat de Apuntes & Post-its</small>
            </div>
          </div>
        </div>
        <button type="button" class="btn-close-chat-window" (click)="toggleMobileQuickNotes()" aria-label="Cerrar Chat">
          <i class="typcn typcn-times font-size-18 text-slate-500"></i>
        </button>
      </div>

      <!-- Cuerpo del Chat (Panel de Notas con feed y barra de entrada) -->
      <div class="chat-window-body">
        <app-quick-notes-panel [availableTasks]="globalTasks"></app-quick-notes-panel>
      </div>

    </div>
  </div>

</div>

<!-- Onboarding Wizard para primer inicio de sesión -->
<app-onboarding-wizard *ngIf="showTutorial" (completed)="onTutorialCompleted()"></app-onboarding-wizard>

<!-- Modal de Colaboración con el Proyecto (cada 7 días, solo usuarios normales) -->
<app-collaboration-modal
  [isOpen]="showCollaborationModal"
  (close)="onCollaborationModalClose()">
</app-collaboration-modal>
