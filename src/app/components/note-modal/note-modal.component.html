<div class="modal-backdrop-custom" *ngIf="isVisible" (click)="onClose()"></div>

<div class="modal-custom" *ngIf="isVisible" tabindex="-1" role="dialog">
  <div class="modal-dialog-custom" role="document" (click)="$event.stopPropagation()">
    <div class="modal-content-custom">
      
      <div class="modal-header-custom">
        <div class="d-flex align-items-center">
          <div class="modal-icon-badge mr-3">
            <i class="typcn typcn-document-add font-size-22" *ngIf="!noteToEdit"></i>
            <i class="typcn typcn-edit font-size-22" *ngIf="noteToEdit"></i>
          </div>
          <div>
            <h5 class="modal-title font-weight-bold mb-0 font-size-18">
              {{ noteToEdit ? 'Editar Tarea' : 'Crear Nueva Tarea' }}
            </h5>
            <small class="text-white-80 font-weight-medium">Formulario de registro en NoteYou</small>
          </div>
        </div>
        <button type="button" class="btn-close-custom" (click)="onClose()" aria-label="Close">
          <i class="typcn typcn-times font-size-20"></i>
        </button>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="modal-body p-4 bg-white">
          
          <div class="form-group mb-3">
            <label class="font-weight-bold text-slate-700 font-size-14">Título de la Tarea <span class="text-danger">*</span></label>
            <input 
              type="text" 
              class="form-control input-custom" 
              placeholder="Ejemplo: Repasar Cálculo o Comprar víveres" 
              [(ngModel)]="title" 
              name="title" 
              required
              #titleInput="ngModel">
            <small class="text-danger" *ngIf="titleInput.invalid && titleInput.touched">
              El título es obligatorio.
            </small>
          </div>

          <div class="row">
            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-slate-700 font-size-14">Categoría <span class="text-danger">*</span></label>
              <select class="form-control input-custom" [(ngModel)]="categoryId" name="categoryId" required>
                <option *ngFor="let cat of categories" [value]="cat.id">
                  {{ cat.name }}
                </option>
              </select>
            </div>

            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-slate-700 font-size-14">Nivel de Prioridad <span class="text-danger">*</span></label>
              <div class="d-flex align-items-center justify-content-between radio-priority-box">
                <div class="form-check form-check-inline mb-0">
                  <input class="form-check-input" type="radio" name="priority" id="prioAlta" value="alta" [(ngModel)]="priority">
                  <label class="form-check-label text-rose-600 font-weight-bold cursor-pointer" for="prioAlta">
                    Alta
                  </label>
                </div>
                <div class="form-check form-check-inline mb-0">
                  <input class="form-check-input" type="radio" name="priority" id="prioMedia" value="media" [(ngModel)]="priority">
                  <label class="form-check-label text-amber-600 font-weight-bold cursor-pointer" for="prioMedia">
                    Media
                  </label>
                </div>
                <div class="form-check form-check-inline mb-0">
                  <input class="form-check-input" type="radio" name="priority" id="prioBaja" value="baja" [(ngModel)]="priority">
                  <label class="form-check-label text-emerald-600 font-weight-bold cursor-pointer" for="prioBaja">
                    Baja
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-slate-700 font-size-14">Estado de la Tarea</label>
              <select class="form-control input-custom" [(ngModel)]="status" name="status">
                <option value="pendiente">Pendiente</option>
                <option value="en_progreso">En Progreso</option>
                <option value="completada">Completada</option>
              </select>
            </div>

            <div class="col-md-6 form-group mb-3">
              <label class="font-weight-bold text-slate-700 font-size-14">Fecha Límite</label>
              <input type="date" class="form-control input-custom" [(ngModel)]="dueDate" name="dueDate">
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="font-weight-bold text-slate-700 font-size-14">Descripción / Detalle</label>
            <textarea 
              class="form-control input-custom" 
              rows="4" 
              placeholder="Escribe los detalles de tu tarea aquí..." 
              [(ngModel)]="content" 
              name="content"></textarea>
          </div>

          <div class="form-group form-check mb-0">
            <input type="checkbox" class="form-check-input" id="isPinnedCheck" [(ngModel)]="isPinned" name="isPinned">
            <label class="form-check-label text-slate-800 font-weight-semibold cursor-pointer" for="isPinnedCheck">
              Fijar esta tarea al inicio de la lista
            </label>
          </div>

        </div>

        <div class="modal-footer bg-slate-50 p-3 border-top d-flex justify-content-end">
          <button type="button" class="btn btn-secondary px-4 font-weight-bold rounded-lg mr-2" (click)="onClose()">Cancelar</button>
          <button type="submit" class="btn btn-gradient-teal px-4 font-weight-bold text-white" [disabled]="!title.trim()">
            {{ noteToEdit ? 'Guardar Cambios' : 'Crear Tarea' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
