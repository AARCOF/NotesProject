<!-- Banner de Cabecera de Calendario -->
<div class="card border-0 rounded-2xl shadow-sm bg-white p-2-5 p-sm-3 mb-2 mb-sm-3 calendar-banner-card">
  <div class="d-flex flex-row justify-content-between align-items-center gap-2">
    <div class="d-flex align-items-center">
      <div class="header-icon-badge bg-gradient-blue text-white rounded-xl d-flex align-items-center justify-content-center mr-2-5 mr-sm-3 shadow-xs">
        <i class="typcn typcn-calendar-outline font-size-22"></i>
      </div>
      <div>
        <h4 class="font-weight-bold text-slate-800 mb-0 font-size-16 font-size-sm-18">Mi Agenda & Calendario</h4>
        <small class="text-slate-500 font-size-12 d-none d-sm-inline-block">Organiza y consulta tus entregas y pendientes por fecha</small>
        <small class="text-slate-500 font-size-12 d-inline-block d-sm-none">Tareas y entregas por fecha</small>
      </div>
    </div>
    
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-gradient-blue font-weight-bold shadow-sm d-flex align-items-center px-3 py-2 text-white rounded-xl font-size-13 hover-lift" (click)="handleCreateNewTaskFromDay('')">
        <i class="typcn typcn-plus mr-1 font-size-16"></i> <span class="d-none d-sm-inline">Nueva Tarea</span><span class="d-inline d-sm-none">Tarea</span>
      </button>
    </div>
  </div>
</div>

<div class="row fade-in-up" *ngIf="!isLoading">
  <div class="col-12">
    <app-task-calendar [tasks]="notes" (dayClick)="onDayClicked($event)"></app-task-calendar>
  </div>
</div>

<!-- Skeleton Loader -->
<div class="row fade-in-up" *ngIf="isLoading">
  <div class="col-12">
    <div class="card shadow-sm border-0 rounded-xl bg-white" style="height: 500px;">
      <div class="card-body d-flex justify-content-center align-items-center">
        <div class="spinner-border text-blue" role="status">
          <span class="sr-only">Cargando...</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Detalles del Día -->
<app-day-details-modal
  [isVisible]="isDayDetailsVisible"
  [date]="selectedDateForDetails"
  [tasks]="notes"
  [categories]="categories"
  (close)="closeDayDetailsModal()"
  (createNewTask)="handleCreateNewTaskFromDay($event)">
</app-day-details-modal>

<!-- Modal para Crear Nota -->
<app-note-modal 
  [isVisible]="isModalVisible"
  [initialDueDate]="initialDueDate"
  [categories]="categories"
  (save)="handleSaveNote($event)"
  (close)="closeModal()">
</app-note-modal>
